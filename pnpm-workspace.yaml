packages:
    - packages/*

allowBuilds:
    esbuild: true

overrides:
    "@types/react": "19.2.14"
    "@types/react-dom": "19.2.3"
    "jszip": "^3.10.1"
    "dompurify": "^3.4.0"
    "@isaacs/brace-expansion": ">=6.0.0"
    "minimatch": ">=10.2.3"
    "basic-ftp": ">=5.2.2"
    "flatted": ">=3.4.0"
    "picomatch@>=4.0.0<4.0.4": ">=4.0.4"
    "picomatch@<2.3.2": ">=2.3.2"
    "picomatch": ">=4.0.4"

patchedDependencies:
    "standalone-electron-types@34.2.0": "patches/standalone-electron-types@34.2.0.patch"

peerDependencyRules:
    ignoreMissing:
        - eslint-plugin-import
        - eslint

allowedDeprecatedVersions:
    source-map-resolve: "*"
    resolve-url: "*"
    source-map-url: "*"
    urix: "*"
    q: "*"
strictPeerDependencies: false
pmOnFail: warn
verifyDepsBeforeRun: prompt
minimumReleaseAge: 7
minimumReleaseAgeExclude:
    - "@song-spotlight/api"
    - "@plexcord/*"
